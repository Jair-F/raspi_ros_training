<!DOCTYPE html>
<html>
<head>
    <title>Flask Color Picker</title>
    <style>
        body { 
            font-family: sans-serif; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh;
            transition: background-color 0.3s;
        }
        .card { 
            background: white; padding: 2rem; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; 
        }
        input[type="color"] { width: 120px; height: 120px; border: none; cursor: pointer; }
    </style>
</head>
<body style="background-color: {{ color }}">
    <div class="card">
        <h1>pick a color</h1>
        <form method="POST" id="colorForm">
            <input type="color" name="selected_color" value="{{ color }}" 
                   onchange="this.form.submit()">
        </form>
        {% if color != "#ffffff" %}
            <p>Active Color: <strong>{{ color }}</strong></p>
        {% endif %}
    </div>
</body>
</html>
